name: intern-task-terraform ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intern-task-terraform/terraform
    env:
      # Fake credentials for plan-only validation; never apply infrastructure.
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_ssh_cidr: "203.0.113.10/32"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -lock=false
