name: intern-task-terraform ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/Dockerfile"
      - "intern-task-app/app/app.py"
      - ".github/workflows/intern-task-terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/Dockerfile"
      - "intern-task-app/app/app.py"
      - ".github/workflows/intern-task-terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: intern-task-terraform/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate