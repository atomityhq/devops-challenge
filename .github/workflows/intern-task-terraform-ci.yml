name: intern-task-terraform ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/Dockerfile"
      - "intern-task-app/app/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/Dockerfile"
      - "intern-task-app/app/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intern-task-terraform/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      # validate passes on an empty or wrong directory, so fail loudly if
      # working-directory ever stops pointing at the module.
      - name: Module directory contains Terraform files
        run: test -n "$(ls ./*.tf 2>/dev/null)"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate