
name: intern-task-terraform-ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform format, validate, and plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: intern-task-terraform/terraform

    env:
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_ssh_cidr: "203.0.113.10/32"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Generate plan
        run: terraform plan -input=false -no-color
