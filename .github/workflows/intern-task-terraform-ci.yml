name: intern-task-terraform-ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: intern-task-terraform/terraform

    env:
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_ssh_cidr: "203.0.113.10/32"
      TF_VAR_git_repo_url: "https://github.com/Anjan007-git/devops-challenge.git"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false
