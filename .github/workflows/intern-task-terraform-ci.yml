name: intern-task-terraform-ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive intern-task-terraform/terraform

      - name: Initialize Terraform
        run: terraform -chdir=intern-task-terraform/terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=intern-task-terraform/terraform validate
