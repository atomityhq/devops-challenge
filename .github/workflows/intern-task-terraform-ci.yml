name: Terraform CI

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/**"
      - ".github/workflows/intern-task-terraform-ci.yml"

  push:
    branches:
      - main
    paths:
      - "intern-task-terraform/**"
      - "intern-task-app/**"
      - ".github/workflows/intern-task-terraform-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: intern-task-terraform/terraform
    shell: bash

jobs:
  validate:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      TF_VAR_ssh_allowed_cidr: "203.0.113.10/32"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock=false
