name: intern-task-app ci

on:
  pull_request:
    paths:
      - "intern-task-app/**"
  push:
    branches: [main]
    paths:
      - "intern-task-app/**"

jobs:
  floor-check:
    # Syntax/schema only — never builds a cluster, never deploys, never
    # judges correctness. Confirms the Dockerfile builds and the Helm chart
    # renders schema-valid YAML for every env; nothing more. The real review
    # is a human's.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intern-task-app
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile builds
        run: docker build -t intern-task-app:ci .

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      # helm is preinstalled on ubuntu-latest runners.
      - name: Helm chart lints
        run: helm lint argocd/charts/web-app -f argocd/values/base.yaml

      - name: Rendered manifests are schema-valid (per env)
        run: |
          for values in argocd/values/*.yaml; do
            env=$(basename "$values" .yaml)
            [ "$env" = base ] && continue
            echo "::group::$env"
            helm template intern-task-app argocd/charts/web-app \
              -n "intern-task-app-$env" \
              -f argocd/values/base.yaml -f "$values" \
              | kubeconform -summary -strict -
            echo "::endgroup::"
          done
