apiVersion: v1
kind: Service
metadata:
  name: intern-task-app
  labels:
    app: intern-task-app
spec:
  type: ClusterIP
  selector:
    app: intern-task-app
  ports:
    - name: http
      port: 80
      # Named port: follows whatever containerPort the Deployment declares,
      # so the two can't drift apart.
      targetPort: http
      protocol: TCP
