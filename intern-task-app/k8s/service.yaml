apiVersion: v1
kind: Service
metadata:
  name: intern-task-app      # Required name. Inside the cluster, other apps
                             # can reach it at http://intern-task-app
  labels:
    app: intern-task-app
spec:
  type: ClusterIP            # Reachable only inside the cluster
  selector:
    app: intern-task-app     # Send traffic to pods with this label
  ports:
    - name: http
      port: 80               # The port the Service listens on
      targetPort: http       # Forward to the pods' port named "http" (8080)