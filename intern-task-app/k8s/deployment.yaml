apiVersion: apps/v1
kind: Deployment
metadata:
  name: intern-task-app
  labels:
    app: intern-task-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intern-task-app
  template:
    metadata:
      labels:
        app: intern-task-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intern-task-app
          image: intern-task-app:local
          # Image is built and `kind load`ed locally; there is no registry.
          # Never fails fast with ErrImageNeverPull instead of trying a pull.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080 # matches ENV PORT in the Dockerfile
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5 # interpreter start under a 200m CPU limit
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
