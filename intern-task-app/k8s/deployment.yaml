apiVersion: apps/v1
kind: Deployment
metadata:
  name: intern-task-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intern-task-app
  template:
    metadata:
      labels:
        app: intern-task-app
    spec:
      containers:
      - name: intern-task-app
        image: intern-task-app:local
        imagePullPolicy: Never 
        env:
        - name: PORT
          value: "5000"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000