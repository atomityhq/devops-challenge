
apiVersion: apps/v1
kind: Deployment

metadata:
  name: intern-task-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: intern-task-app

  template:
    metadata:
      labels:
        app: intern-task-app

    spec:
      containers:
        - name: intern-task-app
          image: intern-task-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 4

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 4
            periodSeconds: 8
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
