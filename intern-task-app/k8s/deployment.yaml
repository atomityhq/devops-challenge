apiVersion: apps/v1
kind: Deployment
metadata:
  name: intern-task-app
  labels:
    app: intern-task-app
spec:

  replicas: 2
  selector:
    matchLabels:
      app: intern-task-app

  template:
    metadata:
      labels:
        app: intern-task-app
    spec:

      containers:
      - name: intern-task-app
        image: intern-task-app:local
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"

        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]  