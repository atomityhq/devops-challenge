
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intern-task-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intern-task-app
  template:
    metadata:
      labels:
        app: intern-task-app
    spec:
      containers:
        - name: intern-task-app
          image: intern-task-app:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
