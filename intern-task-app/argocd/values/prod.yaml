# prod: real cluster, pinned release image, more headroom, autoscaled.
image:
  repository: ghcr.io/mayurvij22/intern-task-app
  tag: "1.0.0" # bumped by a release PR; Argo CD syncs it
  pullPolicy: IfNotPresent

config:
  APP_ENV: prod
  LOG_LEVEL: warn

# Created out-of-band (External Secrets / Sealed Secrets), not stored in git.
existingSecret: intern-task-app-secret

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
